name: Create Release

permissions: {}

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    name: CI
    permissions: {}
    uses: ./.github/workflows/ci.yml
    with:
      attest-package: "true"

  docs:
    name: Verify Docs Build
    permissions: {}
    uses: beeware/.github/.github/workflows/docs-build-verify.yml@741cc5a311012ee0ee195938889a337449d01eeb  # main
    secrets:
      RTD_API_TOKEN: ${{ secrets.RTD_API_TOKEN }}
    with:
      project-name: "toga-chart"
      project-version: ${{ github.ref_name }}

  release:
    name: Create Release
    needs: [ ci, docs ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # This permission is required for trusted publishing.
      id-token: write
    steps:
      - name: Set Build Variables
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.x"

      - name: Get Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: dist

      - name: Install Package
        run: pip install dist/*.whl

      - name: Check version number
        # Check that the setuptools_scm-generated version number is still the same when
        # installed from a wheel with setuptools_scm not present.
        run: |
          set -x
          test $(python -c "from toga_chart import __version__; print(__version__)") = $VERSION

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          artifacts=(dist/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No artifacts found in dist/"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" \
            --draft \
            --title "${VERSION}"

      - name: Publish release to Test PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
