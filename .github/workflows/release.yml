name: Create Release

permissions: {}

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    name: CI
    permissions:
      id-token: write
      contents: read
      attestations: write
      pull-requests: write
    uses: $/.github/workflows/ci.yml
    with:
      attest-package: "true"

  docs:
    name: Verify Docs Build
    permissions:
      contents: read
    uses: beeware/.github/.github/workflows/docs-build-verify.yml@main
    secrets:
      RTD_API_TOKEN: ${{ secrets.RTD_API_TOKEN }}
    with:
      project-name: "toga-chart"
      project-version: ${{ github.ref_name }}

  release:
    name: Create Release
    needs: [ ci, docs ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # This permission is required for trusted publishing.
      id-token: write
    steps:
      - name: Set Build Variables
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"

      - name: Get Package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: dist

      - name: Install Package
        run: pip install dist/*.whl

      - name: Check version number
        # Check that the setuptools_scm-generated version number is still the same when
        # installed from a wheel with setuptools_scm not present.
        run: |
          set -x
          test $(python -c "from toga_chart import __version__; print(__version__)") = $VERSION

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${VERSION}" \
            --draft \
            --verify-tag \
            dist/*

      - name: Publish release to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
